PACKAGE_NAME="mt792x-overdrive"
PACKAGE_VERSION="7.1.8_overdrive"
# Source is backported from 7.1.x: uses NAN APIs missing on 6.x LTS
# (CFG80211_NAN_*). DKMS exits 77 (skip) on older kernels instead of failing.
BUILD_EXCLUSIVE_KERNEL_MIN="7.0"
AUTOINSTALL="yes"

# NOTE: No MAKE/CLEAN override on purpose — DKMS' default
#   make -C $kernel_source_dir M=$dkms_tree/$module/$module_version/build
# already handles kbuild + auto LLVM=1 detection. A custom
# MAKE using ${PACKAGE_NAME}/${PACKAGE_VERSION} breaks when the
# alpm hook mis-splits a hyphenated version (see PKGBUILD pkgver
# comment). No PRE_BUILD either — PKGBUILD already applies
# patch/7.1.8-overdrive.patch at package() time.

BUILT_MODULE_NAME[0]="mt76"
DEST_MODULE_LOCATION[0]="/updates/drivers/net/wireless/mediatek/mt76"

BUILT_MODULE_NAME[1]="mt76-connac-lib"
DEST_MODULE_LOCATION[1]="/updates/drivers/net/wireless/mediatek/mt76"

BUILT_MODULE_NAME[2]="mt792x-lib"
DEST_MODULE_LOCATION[2]="/updates/drivers/net/wireless/mediatek/mt76"

BUILT_MODULE_NAME[3]="mt7921-common"
BUILT_MODULE_LOCATION[3]="mt7921/"
DEST_MODULE_LOCATION[3]="/updates/drivers/net/wireless/mediatek/mt76/mt7921"

BUILT_MODULE_NAME[4]="mt7921e"
BUILT_MODULE_LOCATION[4]="mt7921/"
DEST_MODULE_LOCATION[4]="/updates/drivers/net/wireless/mediatek/mt76/mt7921"
